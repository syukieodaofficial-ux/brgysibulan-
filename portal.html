<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barangay Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background-color: #006400; } /* Dark green for Barangay theme */
        .card { margin-top: 20px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark px-4 py-3 mb-4">
        <span class="navbar-brand mb-0 h1">Barangay Sibulan Portal</span>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
    </nav>

    <div class="container">
        <div class="card p-4">
            <h4 class="mb-4">Welcome to the Barangay Portal!</h4>
            <p>This is a sample page to show connection to the database.</p>
            
            <button class="btn btn-primary mb-3" onclick="loadUsers()">Load Users from Database</button>
            
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Username</th>
                            <th>Full Name</th>
                            <th>Role</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <!-- Users will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Ang path ng database.js ay dapat tama. Kung ang portal.html ay nasa 'portal' folder,
         at ang database.js ay nasa root, kailangan ng '../database.js' -->
    <script src="../database.js"></script>
    <script>
        async function loadUsers() {
            const users = await db.getUsers(); // Gumagamit ng db.getUsers() mula sa database.js
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = '';

            users.forEach(user => {
                tbody.innerHTML += `<tr><td>${user.username}</td><td>${user.full_name}</td><td>${user.role}</td></tr>`;
            });
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = '../login.html'; // I-redirect sa login page
        }
    </script>
</body>
</html>
